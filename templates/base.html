<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Scrapyboard{% endblock %}</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
      header { padding: 16px 20px; border-bottom: 1px solid rgba(127,127,127,.25); }
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      a { color: inherit; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 8px; border-bottom: 1px solid rgba(127,127,127,.25); vertical-align: top; }
      th { text-align: left; font-weight: 600; }
      .muted { opacity: .75; }
      .pill { display: inline-block; padding: 2px 8px; border: 1px solid rgba(127,127,127,.4); border-radius: 999px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Scrapyboard</strong>
      <span class="muted">— données scrapées</span>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
